<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>游戏工具</title>
  <link rel="stylesheet" href="app.css?v=15" />
</head>
<body>
  <div id="backdrop"></div>
  <div id="veil"></div>
  <header>
    <h1 id="title">游戏工具</h1>
    <div class="head-actions">
      <div id="lang-switch" class="lang-switch" role="group" aria-label="语言">
        <button class="lang-btn active" type="button" data-lang="zh-cn" title="简体中文">简</button>
        <button class="lang-btn" type="button" data-lang="zh-tw" title="繁體中文">繁</button>
        <button class="lang-btn" type="button" data-lang="en-us" title="English">EN</button>
      </div>
      <button id="help-open" class="ghost" type="button">说明</button>
      <button id="skin-open" class="ghost" type="button">外观</button>
      <button id="settings-open" class="ghost icon-button" type="button" title="设置路径" aria-label="设置路径">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
  </header>
  <div id="caption" class="caption" role="group" aria-label="窗口">
    <button id="win-min" class="cap" type="button" title="最小化" aria-label="最小化">
      <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10"></path></svg>
    </button>
    <button id="win-max" class="cap" type="button" title="最大化" aria-label="最大化">
      <svg class="i-max" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9"></rect></svg>
      <svg class="i-restore" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 2.5V0.5h7v7h-2"></path><rect x="0.5" y="2.5" width="7" height="7"></rect></svg>
    </button>
    <button id="win-close" class="cap close" type="button" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"></path></svg>
    </button>
  </div>
  <section id="setup" class="setup" hidden>
    <div class="card setup-card" role="dialog" aria-modal="true" aria-labelledby="setup-title">
      <h2 id="setup-title">设置路径</h2>
      <p id="setup-intro" class="setup-intro"></p>
      <div class="setup-row">
        <div id="setup-save-label" class="setup-label">存档目录</div>
        <div class="setup-line">
          <span id="setup-save-path" class="setup-path"></span>
          <button id="setup-save-pick" class="ghost small" type="button">选择文件夹</button>
        </div>
        <p id="setup-save-hint" class="setup-hint"></p>
        <p id="setup-save-status" class="setup-status" hidden></p>
      </div>
      <div class="setup-row">
        <div id="setup-game-label" class="setup-label">游戏目录</div>
        <div class="setup-line">
          <span id="setup-game-path" class="setup-path"></span>
          <button id="setup-game-pick" class="ghost small" type="button">选择文件夹</button>
        </div>
        <p id="setup-game-hint" class="setup-hint"></p>
        <p id="setup-game-status" class="setup-status" hidden></p>
      </div>
      <p id="setup-error" class="error" hidden></p>
      <div class="actions end">
        <button id="setup-cancel" class="ghost" type="button">取消</button>
        <button id="setup-done" type="button" disabled>开始使用</button>
      </div>
      <p id="setup-file" class="setup-file"></p>
    </div>
  </section>
  <main>
    <aside class="card panel">
      <div class="tabs">
        <button id="tab-saves" class="tab active" type="button">当前存档</button>
        <button id="tab-backups" class="tab" type="button">备份区</button>
      </div>
      <div id="saves-pane" class="list"></div>
      <div id="backups-pane" class="list" hidden></div>
    </aside>
    <section class="detail">
      <div id="slot-head">
        <div class="slot-title">
          <h2 id="slot-name">未选择存档</h2>
          <p id="slot-time" class="muted"></p>
        </div>
        <button id="backup-add" class="ghost small" type="button">加入备份区</button>
      </div>
      <div id="error" class="error" hidden></div>
      <div id="library" class="library" hidden>
        <label class="search">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
          <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="输入物品名，如 阿贾克斯、夹克、传说组件、网络接入仓、配方" />
        </label>
        <div id="chips" class="chips"></div>
        <div class="lib-bar">
          <div class="ownership-filter" id="ownership-filter" role="radiogroup" aria-label="状态筛选">
            <button type="button" class="seg-btn active" data-ownership="all" id="ownership-all">全部</button>
            <button type="button" class="seg-btn" data-ownership="unowned" id="ownership-unowned">未拥有</button>
            <button type="button" class="seg-btn" data-ownership="owned" id="ownership-owned">已拥有</button>
          </div>
          <div class="lib-bar-right">
            <button id="batch-toggle-btn" class="ghost small batch-toggle-btn" type="button">批量选择</button>
            <div id="lib-meta" class="lib-meta"></div>
            <label class="page-size"><span id="page-size-label">每页</span>
              <select id="page-size">
                <option value="15">15</option>
                <option value="30">30</option>
                <option value="60">60</option>
              </select>
            </label>
          </div>
        </div>
        <div id="results" class="results">
          <div id="grid" class="grid"></div>
          <div id="lib-empty" class="empty" hidden></div>
          <nav id="pager" class="pager" aria-label="翻页" hidden></nav>
        </div>
        <div id="batch-bar" class="batch-bar" hidden>
          <div class="batch-bar-content">
            <div class="batch-info">
              <span class="batch-icon">☑</span>
              <span class="batch-count" id="batch-count">已选 0 项</span>
            </div>
            <div class="batch-dest-box">
              <label id="batch-dest-label" for="batch-dest">存放位置：</label>
              <select id="batch-dest" class="batch-dest-select">
                <option value="smart" id="opt-batch-smart">智能推荐（不朽入储藏室）</option>
                <option value="backpack" id="opt-batch-backpack">全部放入背包</option>
                <option value="stash" id="opt-batch-stash">全部放入储藏室</option>
              </select>
            </div>
            <div class="batch-actions">
              <button id="batch-clear-btn" class="ghost small" type="button">清空</button>
              <button id="batch-submit-btn" class="primary small" type="button">一键获得</button>
              <button id="batch-cancel-btn" class="ghost small" type="button">退出多选</button>
            </div>
          </div>
        </div>
      </div>
      <div id="backup-view" class="backup-view" hidden>
        <div id="backup-rows" class="card backup-rows"></div>
        <div id="backup-actions" class="actions"></div>
      </div>
    </section>
  </main>
  <div id="skin-panel" class="card skin-panel" hidden>
    <h2 id="skin-title">外观</h2>
    <label id="skin-drop" class="drop">
      <span id="skin-drop-text">选择图片，或把图片拖到这里</span>
      <input id="skin-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
    </label>
    <div class="actions">
      <button id="skin-clear" class="ghost" type="button">清除背景</button>
    </div>
    <label class="overlay-label"><span id="skin-mask-label">遮罩</span> <span id="skin-opacity-label">50%</span>
      <input id="skin-opacity" type="range" min="0" max="80" value="50" />
    </label>
  </div>
  <section id="help" class="help" hidden>
    <div class="card help-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div class="help-head">
        <h2 id="help-title">说明</h2>
        <button id="help-close" class="ghost icon-button help-close" type="button" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <div class="tabs help-tabs" role="tablist" aria-label="说明">
        <button class="tab active" type="button" role="tab" aria-selected="true" data-help-tab="start">快速上手</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-help-tab="faq">常见问题</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-help-tab="about">关于</button>
      </div>
      <div id="help-body" class="help-body">
        <div class="help-pane" role="tabpanel" data-help-pane="start"></div>
        <div class="help-pane" role="tabpanel" data-help-pane="faq" hidden></div>
        <div class="help-pane" role="tabpanel" data-help-pane="about" hidden></div>
      </div>
    </div>
  </section>
  <div id="confirm" class="modal" hidden>
    <div class="card dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title" hidden></h2>
      <div id="confirm-preview" class="preview" hidden></div>
      <p id="confirm-text"></p>
      <div id="confirm-body"></div>
      <p id="confirm-error" class="error" hidden></p>
      <div id="confirm-actions" class="actions end"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div class="edges" aria-hidden="true">
    <div class="edge" data-edge="top"></div>
    <div class="edge" data-edge="bottom"></div>
    <div class="edge" data-edge="left"></div>
    <div class="edge" data-edge="right"></div>
    <div class="edge" data-edge="topLeft"></div>
    <div class="edge" data-edge="topRight"></div>
    <div class="edge" data-edge="bottomLeft"></div>
    <div class="edge" data-edge="bottomRight"></div>
  </div>
  <script src="i18n.js?v=1"></script>
  <script src="app.js?v=17"></script>
</body>
</html>
