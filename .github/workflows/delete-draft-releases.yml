# 一次性清理：删除仓库里所有未发布的 Release 草稿（正式发布的不受影响）。用完即删。
name: Delete draft releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all draft releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft) | .id' | while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            echo "deleted draft release $id"
          done
