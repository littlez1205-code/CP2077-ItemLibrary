# 发版：在 GitHub 的 Windows 机器上构建、跑全部测试、用 src/release/package-release.ps1 打包，
# 然后创建 Release 草稿（附 zip 和 SHA-256）。草稿不公开：下载检查无误后，在 GitHub 的 Release 页面点「Publish」。
# 版本号取自 src/Directory.Build.props；草稿发布时才会创建 v<版本> 标签。
# 可以重复运行：同一版本已有的草稿会被新草稿替换；已经正式发布的版本拒绝覆盖。
name: Release

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Release 标题（留空则为 v<版本>）"
        required: false
        type: string
      notes:
        description: "Release 说明（Markdown，留空则只写下载说明）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build src/GameTool.slnx -c Release

      - name: Test
        run: dotnet test src/GameTool.slnx -c Release --no-build

      - name: Package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File src\release\package-release.ps1

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$props = Get-Content -LiteralPath src/Directory.Build.props -Raw
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          $tag = "v$version"
          # 按标签查只会查到正式发布的版本（草稿发布前没有标签）；gh release view 会连草稿一起查到，不能用来判断。
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag 已经正式发布，先改版本号。" }
          # 草稿没有标签，按 tag_name 找出同一版本的旧草稿并删除，避免出现多个同名草稿。
          $drafts = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft) | [.id, .tag_name] | @tsv'
          if ($LASTEXITCODE -ne 0) { throw "读取已有 Release 失败（$LASTEXITCODE）" }
          foreach ($line in @($drafts | Where-Object { $_ })) {
            $id, $name = $line -split "`t"
            if ($name -ne $tag) { continue }
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$id" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "删除旧草稿 $id 失败（$LASTEXITCODE）" }
            Write-Host "已删除同一版本的旧草稿 $id"
          }
          $zip = "artifacts/release/GameTool-CP2077-$tag-win-x64.zip"
          $sha = "$zip.sha256.txt"
          if (-not (Test-Path -LiteralPath $zip) -or -not (Test-Path -LiteralPath $sha)) { throw "找不到打包结果 $zip" }
          $title = if ([string]::IsNullOrWhiteSpace($env:TITLE)) { $tag } else { $env:TITLE }
          $notes = if ([string]::IsNullOrWhiteSpace($env:NOTES)) {
            "## 下载`n`n- GameTool-CP2077-$tag-win-x64.zip：解压后双击「赛博朋克2077物品库.exe」，自包含单文件程序，无需另装运行库。`n- GameTool-CP2077-$tag-win-x64.zip.sha256.txt：压缩包的 SHA-256 校验值。"
          } else { $env:NOTES }
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP/notes.md", $notes, (New-Object System.Text.UTF8Encoding $false))
          gh release create $tag $zip $sha --draft --target $env:GITHUB_SHA --title $title --notes-file "$env:RUNNER_TEMP/notes.md"
          if ($LASTEXITCODE -ne 0) { throw "gh release create 失败（$LASTEXITCODE）" }
          Write-Host "已创建草稿 $tag：$(gh release view $tag --json url --jq .url)"
